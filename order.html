<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07090e" />
    <!-- The address of this page carries the order's private key (k): no request from it may name the address.
         So no referrer, and no third-party script or font here (no analytics, no pixel). -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- The page transition (src/motion/transition.css) never covers an order, a payment or a form: this page arrives without it when its address names
         an order (o, k, s), a payment (checkout, session_id) or the online withdrawal function (withdraw). The address is read while the head is parsed: the page's own script may already have tidied it (a return from payment is cleaned) when the page is revealed. -->
    <script>(function(q){addEventListener('pagereveal',function(e){var v=e.viewTransition;if(v&&/[?&](o|k|s|checkout|session_id|withdraw)=/.test(q))v.skipTransition()})})(location.search)</script>
    <title>Your order | SnapEyes</title>
    <meta name="description" content="Your SnapEyes order: your iris artwork is made here and ready to download." />
    <link rel="preload" as="font" type="font/woff2" href="/assets/atelier/fonts/cinzel-var.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/atelier/fonts/plus-jakarta-sans-var.woff2" crossorigin />
  </head>
  <body class="fx bg-[#07090e] text-[#f0f3fa] antialiased overflow-x-hidden">
    <noscript>
      <div style="padding:24px;font-family:sans-serif;color:#f0f3fa;line-height:1.6">
        <p>Your SnapEyes order. Please enable JavaScript to see it and download your file.</p>
        <p>Questions: <a href="mailto:info@snapeyes.com" style="color:#f5c542">info@snapeyes.com</a></p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/order/main.tsx"></script>
  </body>
</html>
